<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="70%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="earthGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="80%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="109" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />

  <!-- Outer scanning radar rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Elliptical satellite orbit -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#orbitGrad)" stroke-width="4" transform="rotate(-30 256 256)" filter="url(#glow)" />

  <!-- Central Planet Earth -->
  <circle cx="256" cy="256" r="95" fill="url(#earthGrad)" filter="url(#glow)" />

  <!-- Continents / Atmosphere detail -->
  <path d="M 220 200 Q 240 180 270 190 T 300 230 Q 280 260 250 250 T 210 230 Z" fill="#34d399" fill-opacity="0.35" />
  <path d="M 230 270 Q 270 280 290 310 T 260 335 Q 230 320 225 290 Z" fill="#38bdf8" fill-opacity="0.3" />

  <!-- Crosshair / Reticle target markers -->
  <line x1="256" y1="90" x2="256" y2="125" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="387" x2="256" y2="422" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="90" y1="256" x2="125" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="387" y1="256" x2="422" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Satellite on orbit -->
  <g transform="translate(380, 160)">
    <!-- Satellite body -->
    <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Solar panels -->
    <rect x="-42" y="-9" width="22" height="18" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-31" y1="-9" x2="-31" y2="9" stroke="#bae6fd" stroke-width="1" />
    <rect x="20" y="-9" width="22" height="18" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="31" y1="-9" x2="31" y2="9" stroke="#bae6fd" stroke-width="1" />
    <!-- Center beam / sensor lens -->
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
  </g>
</svg>
